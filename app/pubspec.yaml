name: silaisetu
description: SilaiSetu — Your Tailoring Business, Connected.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  dio: ^5.11.1
  flutter_secure_storage: ^10.3.4
  shared_preferences: ^2.5.5
  intl: 0.20.2
  google_fonts: ^8.1.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.2
  path_provider: ^2.1.5
  fl_chart: ^1.3.0
  table_calendar: ^3.2.1
  pdf: ^3.12.0
  share_plus: ^12.0.2
  printing: ^5.14.3

dependency_overrides:
  # image 4.11 needs ZLibDecoder.decodeLazy (archive >= 4.1)
  archive: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#2B2C6C"
  adaptive_icon_foreground: assets/branding/app_icon.png
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/measurements/
    - assets/onboarding/
    - assets/branding/
